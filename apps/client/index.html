<!doctype html>
<html lang="en">
  <head>
    <!--
      Every other URL on this page is relative to this. The server rewrites the
      href to wherever the game is mounted (e.g. /the-floor/), so the same HTML
      works at a domain root, under a path prefix, or inside a packaged app.
      It must stay the first element in <head>: relative URLs above it would
      resolve before the base is known.
    -->
    <base href="/" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Beer Bets</title>

    <!--
      Phone home-screen support. `apple-mobile-web-app-capable` is what makes
      iOS launch this without Safari's chrome, which matters here because the
      address bar eats the bottom of a full-screen 3D view.
    -->
    <link rel="manifest" href="./assets/manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beer Bets" />
    <link rel="stylesheet" href="./js/style.css" />

    <!--
      Addresses here must begin with ./ — a bare path like "pkg/sim/index.js"
      is read as another bare specifier and silently blocked with a null value.

      The client runs as plain ES modules with no bundler. This import map
      points the bare specifiers at the same compiled output the server imports,
      so prediction and authority literally share one copy of the simulation.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "@keydate/sim": "./pkg/sim/index.js",
          "@keydate/netcode": "./pkg/netcode/index.js",
          "@keydate/protocol": "./pkg/protocol/index.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Join screen -------------------------------------------------------->
    <div id="join-screen" class="overlay">
      <form id="join-form" class="panel">
        <h1>Beer Bets</h1>
        <p class="tagline">
          A casino floor you walk around in, with friends. Chips are virtual and have no cash value.
        </p>

        <label for="name-input">Display name</label>
        <input
          id="name-input"
          type="text"
          maxlength="20"
          autocomplete="off"
          placeholder="Your name"
          required
        />

        <label for="code-input"
          >Session code <span class="hint">(blank joins the public floor)</span></label
        >
        <input
          id="code-input"
          type="text"
          maxlength="5"
          autocomplete="off"
          placeholder="e.g. FRIED"
        />

        <button type="submit" id="join-button">Enter the floor</button>
        <p id="join-error" class="error" hidden></p>
      </form>
    </div>

    <!-- In-world HUD ------------------------------------------------------->
    <div id="hud" hidden>
      <div id="crosshair"></div>

      <div id="top-left" class="hud-block">
        <div id="chips"><span class="label">Chips</span> <span id="chips-value">0</span></div>
        <div id="session"><span class="label">Session</span> <span id="session-value">—</span></div>
        <div id="drunk-row" hidden>
          <span class="label">Drunk</span>
          <div id="drunk-meter"><div id="drunk-bar"></div></div>
        </div>
      </div>

      <div id="top-right" class="hud-block">
        <div id="netstat"><span class="label">Ping</span> <span id="ping-value">—</span></div>
        <button id="view-toggle" type="button">Third person</button>
      </div>

      <div id="interact-prompt" hidden><kbd>E</kbd> <span id="interact-label"></span></div>

      <!-- Table panel, shown only while seated -->
      <div id="table-panel" hidden>
        <header>
          <h2 id="table-title">Table</h2>
          <div id="table-phase" class="phase">—</div>
          <button id="leave-table" type="button">Stand up</button>
        </header>

        <div id="table-timer"><div id="table-timer-bar"></div></div>

        <!-- The live hand, on tables that have one. Blackjack, so far. -->
        <div id="table-hand" hidden>
          <div id="hand-dealer" class="hand-row"></div>
          <div id="hand-seats"></div>
          <div id="hand-actions"></div>
        </div>

        <div id="table-spots"></div>

        <div id="stake-row">
          <span class="label">Stake</span>
          <div id="stake-buttons"></div>
          <span id="stake-value">50</span>
          <button id="clear-bets" type="button">Clear bets</button>
        </div>

        <div id="table-wagers"></div>
        <div id="table-result" hidden></div>
        <div id="fairness" class="fairness"></div>
      </div>

      <!-- Bar menu, shown when standing at the counter -->
      <div id="bar-panel" hidden>
        <header>
          <h2 id="bar-title">The Tap Room</h2>
          <button id="leave-bar" type="button">Close</button>
        </header>
        <div id="bar-menu"></div>
        <p class="bar-note">Chips come from the tables. Nothing here is for sale for real money.</p>
      </div>

      <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" type="text" maxlength="200" placeholder="Press Enter to chat" />
      </div>

      <!-- Touch controls, shown only on coarse-pointer devices -->
      <div id="touch-controls" hidden>
        <button id="touch-jump" type="button">Jump</button>
        <button id="touch-interact" type="button">Use</button>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
